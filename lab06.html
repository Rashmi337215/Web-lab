<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .calculator {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    .calculator h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .button-row button {
      flex: 1 1 calc(50% - 10px);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>Simple Calculator</h2>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    
    <div class="button-row">
      <button onclick="calculate('sum')">Sum</button>
      <button onclick="calculate('product')">Product</button>
      <button onclick="calculate('difference')">Difference</button>
      <button onclick="calculate('quotient')">Quotient</button>
    </div>
    
    <div class="button-row">
      <button onclick="calculate('remainder')">Remainder</button>
      <button onclick="calculate('power')">Power</button>
      <button onclick="calculate('squareRoot')">Square Root</button>
      <button onclick="calculate('square')">Square</button>
    </div>

    <div id="result">Result</div>
  </div>

  <script>
    function calculate(operation) {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      let result;

      switch (operation) {
        case 'sum':
          result = num1 + num2;
          break;
        case 'product':
          result = num1 * num2;
          break;
        case 'difference':
          result = num1 - num2;
          break;
        case 'quotient':
          result = num2 !== 0 ? num1 / num2 : 'Cannot divide by zero';
          break;
        case 'remainder':
          result = num2 !== 0 ? num1 % num2 : 'Cannot divide by zero';
          break;
        case 'power':
          result = Math.pow(num1, num2);
          break;
        case 'squareRoot':
          result = `√${num1} = ${Math.sqrt(num1)}, √${num2} = ${Math.sqrt(num2)}`;
          break;
        case 'square':
          result = `${num1}² = ${num1 * num1}, ${num2}² = ${num2 * num2}`;
          break;
        default:
          result = 'Invalid operation';
      }

      document.getElementById('result').innerText = `Result: ${result}`;
    }
  </script>
</body>
</html>
